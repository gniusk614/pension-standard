<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>몽산포 휴일펜션 — 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="admin.css?v=18">
</head>
<body>

<!-- 로그인 화면 -->
<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm">
    <h1>몽산포 휴일펜션 관리자</h1>
    <p>등록된 관리자 계정으로 로그인하세요.</p>
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn--block" type="submit">로그인</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- 관리자 앱 -->
<div id="app" hidden>
  <div class="topbar">
    <div class="topbar__title">몽산포 휴일펜션 <small>콘텐츠 관리</small></div>
    <div class="topbar__actions">
      <span class="topbar__user" id="who"></span>
      <a class="btn btn--ghost btn--sm" href="../index.html" target="_blank" rel="noopener">사이트 보기</a>
      <button class="btn btn--ghost btn--sm" id="logout">로그아웃</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>

  <div class="savebar">
    <span class="savemsg" id="saveMsg">변경 후 저장을 눌러야 사이트에 반영됩니다.</span>
    <div class="actions">
      <button class="btn btn--ghost" id="reload">되돌리기</button>
      <button class="btn" id="save">저장하기</button>
    </div>
  </div>
</div>

<div class="uploading" id="uploading">업로드 중…</div>

<!-- 기본 콘텐츠(SITE) + Firebase 설정 -->
<script src="../assets/content.js?v=18"></script>
<script src="../assets/firebase-config.js?v=18"></script>
<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script src="admin.js?v=18"></script>
</body>
</html>
