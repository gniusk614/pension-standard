<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 제목·메타는 정적 기본값(크롤러용) + main.js 가 SITE.seo.home 으로 동일 값 주입 -->
<title>몽산포 휴일펜션 — 충남 태안 몽산포</title>
<meta name="description" content="충청남도 태안 몽산포해수욕장 인근, 몽산포 휴일펜션. 전 객실 취사 가능, 전용 바비큐장.">
<link rel="canonical" href="https://gniusk614.github.io/pension-standard/">
<meta property="og:type" content="website">
<meta property="og:title" content="몽산포 휴일펜션">
<meta property="og:description" content="충청남도 태안 몽산포, 몽산포 휴일펜션.">
<meta property="og:image" content="https://gniusk614.github.io/pension-standard/assets/images/exterior-1.jpg">
<meta property="og:url" content="https://gniusk614.github.io/pension-standard/">

<!-- 검색엔진 소유확인: 등록 후 발급 코드를 아래 content 에 채우세요 -->
<!-- <meta name="naver-site-verification" content="여기에_네이버_서치어드바이저_코드"> -->
<!-- <meta name="google-site-verification" content="여기에_구글_서치콘솔_코드"> -->

<!-- 구조화 데이터(LodgingBusiness) — 검색/지도 인식용 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LodgingBusiness",
  "name": "몽산포 휴일펜션",
  "description": "충청남도 태안 몽산포해수욕장 인근 펜션. 전 객실 취사 가능, 전용 바비큐장.",
  "url": "https://gniusk614.github.io/pension-standard/",
  "image": "https://gniusk614.github.io/pension-standard/assets/images/exterior-1.jpg",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "KR",
    "addressRegion": "충청남도",
    "addressLocality": "태안군 남면",
    "streetAddress": "몽산포길 140"
  },
  "priceRange": "₩₩"
}
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="assets/style.css?v=18">
</head>
<body id="page-home">

<!-- 헤더 (main.js 에서 렌더) -->
<div id="site-header"></div>

<main>

  <!-- ============ 1. 히어로 ============ -->
  <section class="hero">
    <div class="hero__slides" id="heroSlides"></div>
    <div class="hero__body">
      <p class="hero__eyebrow" id="heroEyebrow"></p>
      <h1 class="hero__title pre-line" id="heroTitle"></h1>
    </div>
    <div class="hero__scroll"><span>SCROLL</span><i></i></div>
  </section>

  <!-- ============ 2. ABOUT ============ -->
  <section class="sec">
    <div class="wrap">
      <div class="about fadeup">
        <div class="about__txt">
          <span class="eyebrow" id="aboutEyebrow"></span>
          <h2 class="sec-title pre-line" id="aboutTitle"></h2>
          <p class="lead pre-line" id="aboutBody"></p>
          <a class="more" id="aboutMore" href="about.html"></a>
        </div>
        <div class="about__img" id="aboutImg"></div>
      </div>
    </div>
  </section>

  <!-- ============ 3. ROOMS ============ -->
  <section class="sec sec--alt" id="rooms">
    <div class="wrap">
      <div class="rooms__top fadeup">
        <div class="sec-head" data-sec="rooms"></div>
        <div class="tabs" id="roomTabs"></div>
      </div>
      <div class="room-panel fadeup" id="roomPanel"></div>
    </div>
  </section>

  <!-- ============ 4. SPECIAL ============ -->
  <section class="sec" id="special">
    <div class="wrap">
      <div class="sec-head fadeup" data-sec="special"></div>
      <div class="special fadeup" id="specialGrid"></div>
    </div>
  </section>

  <!-- ============ 5. 갤러리 ============ -->
  <section class="sec--tight sec--flush-top">
    <div class="gallery" id="galleryGrid"></div>
  </section>

  <!-- ============ 6. TRAVEL ============ -->
  <section class="sec sec--alt" id="travel">
    <div class="wrap">
      <div class="rooms__top fadeup">
        <div class="sec-head" data-sec="travel"></div>
        <a class="more" id="travelMore" href="travel.html"></a>
      </div>
      <div class="travel fadeup" id="travelGrid"></div>
    </div>
  </section>

  <!-- ============ 7. LOCATION ============ -->
  <section class="sec" id="location">
    <div class="wrap">
      <div class="sec-head fadeup" data-sec="location"></div>
      <div class="location fadeup">
        <div class="map" id="mapBox"></div>
        <dl class="addr">
          <dt id="addrLabel"></dt>
          <dd>
            <span id="addrRoad"></span><br>
            <span class="addr__lot" id="addrLot"></span><br>
            <button class="copy-btn" type="button" id="copyAddr"></button>
          </dd>
          <dt id="carLabel"></dt>
          <dd id="carRoute"></dd>
          <dt id="transitLabel"></dt>
          <dd id="transitRoute"></dd>
        </dl>
      </div>
    </div>
  </section>

  <!-- ============ 8. 예약 CTA ============ -->
  <section class="cta">
    <img id="ctaImg" src="" alt="">
    <div class="cta__body">
      <h2 class="cta__title pre-line" id="ctaTitle"></h2>
      <p class="cta__desc" id="ctaDesc"></p>
      <div class="cta__btns">
        <a class="btn btn--primary" data-booking href="#" id="ctaBook"></a>
        <a class="btn btn--ghost-inv" href="reservation.html" id="ctaGuide"></a>
      </div>
    </div>
  </section>

</main>

<!-- 푸터 · 플로팅 · 팝업 (main.js 에서 렌더) -->
<div id="site-footer"></div>
<div id="site-floating"></div>
<div id="site-popup"></div>

<script src="assets/content.js?v=18"></script>
<script src="assets/main.js?v=18"></script>
</body>
</html>
